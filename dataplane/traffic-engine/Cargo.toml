[package]
name = "traffic-engine"
# 版本 / edition / license 一律继承工作区（根 Cargo.toml 的 [workspace.package]）。
# 此处**刻意不再写字面量**：写过一次就多出一份需要手工同步的副本，
# 而「忘了同步」的表现只是版本号悄悄不一致，难以察觉。
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust traffic analysis core: flow, session, reassembly, dpi, feature, behavior, risk."

# 版本号实际注入由 build.rs 完成（读取仓库根 VERSION）。Cargo 的 version 字段
# 仅供包元数据使用，产物对外报告的版本以 CYTHSEC_VERSION 为准。
build = "build.rs"

# 本阶段为单包骨架，实现最小数据链 Packet -> Flow -> Session：
#   src/flow/    五元组 Packet 与 Flow 流模型
#   src/session/ 双向 Session 会话模型
#
# 二进制名：traffic-engine（src/main.rs，演示入口）
# 库名：traffic_engine（src/lib.rs，供 main 与单元/集成测试复用）
#
# crates/ 下的独立子 crate（reassembly/dpi/feature/behavior/risk/common 等）
# 将在后续迭代逐个补全并加入上层根 workspace members，当前统一在单包内演进。
[lib]
name = "traffic_engine"
path = "src/lib.rs"

[[bin]]
name = "traffic-engine"
path = "src/main.rs"

# 通道 ABI 的跨语言 parity 输出入口（CYS-PKT-024 第 3 层）。
# 与 C++ 侧 cythsec-dump-abi 的输出逐行 diff，是唯一能发现「一侧改了、另一侧没改」的手段。
[[bin]]
name = "dump-abi"
path = "src/bin/dump_abi.rs"

# 共享环消费侧驱动：C++ cythsec-ring-feed 的对应读端（CYS-TRF-034）。
# 两者配对构成「C++ 写 → 共享环 → Rust 解成 Flow」的跨语言端到端链路。
[[bin]]
name = "ring-consume"
path = "src/bin/ring_consume.rs"

# 离线 pcap 分析入口（CYS-TRF-035）：pcap -> FlowRecord(JSONL)。
# 它让整条数据链无需采集面/共享内存即可端到端验证，同时是那条链的回归载体。
[[bin]]
name = "cythsec-analyze"
path = "src/bin/analyze.rs"

[dependencies]

# 零第三方依赖，保持最小工程可离线构建、便于工具链验证。
[dev-dependencies]
