name: cythsec-storage-test

services:
  clickhouse:
    image: ${CYTHSEC_TEST_CLICKHOUSE_IMAGE:?prepare middleware test environment}
    environment:
      CLICKHOUSE_USER: ${CYTHSEC_TEST_CLICKHOUSE_USER:?prepare middleware test environment}
      CLICKHOUSE_PASSWORD: ${CYTHSEC_TEST_CLICKHOUSE_PASSWORD:?prepare middleware test environment}
      CYTHSEC_TEST_CLICKHOUSE_HOST: ${CYTHSEC_TEST_CLICKHOUSE_HOST:?prepare middleware test environment}
      CYTHSEC_TEST_CLICKHOUSE_PORT: ${CYTHSEC_TEST_CLICKHOUSE_PORT:?prepare middleware test environment}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse-test.xml:/etc/clickhouse-server/config.d/cythsec-test.xml:ro
    networks:
      - storage_test
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --host \"$$CYTHSEC_TEST_CLICKHOUSE_HOST\" --port \"$$CYTHSEC_TEST_CLICKHOUSE_PORT\" --user \"$$CLICKHOUSE_USER\" --query 'SELECT 1' >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  writer:
    profiles: ["writer"]
    image: ${CYTHSEC_TEST_CLICKHOUSE_IMAGE:?prepare middleware test environment}
    entrypoint: ["/opt/cythsec/cythsec-ch-write-linux"]
    environment:
      CLICKHOUSE_HOST: ${CYTHSEC_TEST_CLICKHOUSE_HOST:?prepare middleware test environment}
      CLICKHOUSE_USER: ${CYTHSEC_TEST_CLICKHOUSE_USER:?prepare middleware test environment}
      CLICKHOUSE_PASSWORD: ${CYTHSEC_TEST_CLICKHOUSE_PASSWORD:?prepare middleware test environment}
      CLICKHOUSE_PORT: ${CYTHSEC_TEST_CLICKHOUSE_PORT:?prepare middleware test environment}
    volumes:
      - ../../build/storage-measurement:/opt/cythsec:ro
      - writer_spool:/var/spool/cythsec
    networks:
      - storage_test

volumes:
  clickhouse_data:
  writer_spool:

networks:
  storage_test:
    internal: true
