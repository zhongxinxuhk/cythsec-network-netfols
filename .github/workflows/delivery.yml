name: Delivery
'on':
  push:
    tags:
    - v*
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read
  draft-release:
    needs:
    - verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        name: cythsec-linux-amd64
        path: build/release/
    - name: Verify tag and exact package before draft release
      run: '[[ "${RELEASE_TAG}" == "v$(tr -d ''[:space:]'' < VERSION)" ]]

        (cd build/release && sha256sum --check SHA256SUMS)

        python3 -c ''import json,os; m=json.load(open("build/release/manifest.json")); assert m["commit"] == os.environ["GITHUB_SHA"]''

        gh release create "${RELEASE_TAG}" build/release/* --verify-tag --draft --title "CythSec ${RELEASE_TAG}"
        --generate-notes'
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.ref_name }}
