name: CI

# 触发条件：推送到 main 或开启/更新 PR 时运行。
on:
  push:
    branches: [main]
  pull_request:

# 四语言矩阵：cpp / rust / go / node，各自 build + test。
# 构建与测试逻辑全部收敛在 scripts/ 下，本 workflow 只负责环境准备与调用（CYS-INF-007）。
jobs:
  clickhouse-storage:
    name: FlowRecord MergeTree 写入与读回
    runs-on: ubuntu-latest
    env:
      CLICKHOUSE_VERSION: 26.10.2.103
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: Swatinem/rust-cache@v2
      - name: 下载固定版本 ClickHouse 并校验官方 SHA512
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, subprocess, urllib.request
          version = os.environ['CLICKHOUSE_VERSION']
          name = f'clickhouse-common-static-{version}-amd64.tgz'
          url = f'https://packages.clickhouse.com/tgz/stable/{name}'
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / name
          urllib.request.urlretrieve(url, archive)
          expected = urllib.request.urlopen(url + '.sha512').read().decode().split()[0]
          assert hashlib.sha512(archive.read_bytes()).hexdigest() == expected
          subprocess.run(['tar', '-xzf', str(archive), '-C', os.environ['RUNNER_TEMP']], check=True)
          binary = pathlib.Path(os.environ['RUNNER_TEMP']) / f'clickhouse-common-static-{version}/usr/bin/clickhouse'
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'CLICKHOUSE_BIN={binary}\n')
          PY
      - name: 真实写入、持久化读回与故障注入
        run: |
          bash scripts/test/test-all.sh --plan
          bash scripts/verify/check-clickhouse-storage.sh
      - name: Compose 服务写入与容器重建持久化
        run: python3 scripts/verify/check-clickhouse-compose.py
      - name: native 写入器竞态检查与真实失败重放
        run: |
          cd services/pkg
          GOWORK=off GOPROXY=off GOTOOLCHAIN=local go test -race ./clickhousewriter
          cd ../..
          python3 scripts/verify/check-clickhouse-writer.py
      - name: 采集持久化发布与文件断点恢复（含 SIGKILL）
        run: python3 scripts/verify/check-clickhouse-resume.py
      - name: 上传服务模式测量报告
        uses: actions/upload-artifact@v4
        with:
          name: clickhouse-compose-measurement
          path: |
            build/storage-measurement/clickhouse-compose.json
            build/storage-measurement/clickhouse-writer.json
            build/storage-measurement/clickhouse-resume.json
      - name: 停止 CI 测试编排（保留卷）
        if: always()
        run: docker compose -f deploy/docker/compose.storage-test.yml down

  cpp:
    name: C++ 构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 CMake
        uses: lukka/get-cmake@latest
      - name: 构建并测试 (C++)
        run: |
          bash scripts/build/build-all.sh --cpp
          bash scripts/test/test-all.sh --cpp

  rust:
    name: Rust 构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 缓存 Cargo registry + target
        uses: Swatinem/rust-cache@v2
      - name: 构建并测试 (Rust)
        run: |
          bash scripts/build/build-all.sh --rust
          bash scripts/test/test-all.sh --rust

  go:
    name: Go 构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: 缓存 Go 构建与模块
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: 构建并测试 (Go)
        run: |
          bash scripts/build/build-all.sh --go
          bash scripts/test/test-all.sh --go

  e2e:
    name: 控制面端到端验证
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: 生成四服务二进制（含版本注入）
        run: bash scripts/build/build-all.sh --go
      - name: 安装 jq（日志结构化校验用）
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: 启动四服务并逐项验收（CYS-TEL-002 的可执行验收）
        # WORK_DIR 固定路径 + 失败保留，使下面的 artifact 上传有实际内容可传。
        env:
          WORK_DIR: ${{ runner.temp }}/e2e-work
        run: bash scripts/verify/e2e-control-plane.sh
      - name: 失败时上传四服务日志与指标
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-workdir
          path: ${{ runner.temp }}/e2e-work
          if-no-files-found: warn

  node:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/console/package-lock.json
      - name: 安装依赖 + 类型检查 + 构建
        run: |
          cd web/console
          npm ci
          npm run typecheck
          npx playwright install --with-deps chromium
          npm test
          npm run build
      - name: 上传 dist 产物
        uses: actions/upload-artifact@v4
        with:
          name: web-console-dist
          path: web/console/dist
