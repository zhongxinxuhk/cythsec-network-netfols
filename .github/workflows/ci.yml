name: CI
run-name: CI · ${{ github.event_name }} · ${{ github.head_ref || github.ref_name }}
'on':
  push:
    branches:
    - main
    - master
  pull_request: null
  merge_group: null
  workflow_dispatch: null
  workflow_call: null
jobs:
  workflow-tests:
    name: Workflow and gate contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: ./.github/actions/toolchains
      with:
        go: 1.27.3
    - name: Install validators
      run: 'python3 -m pip install -r tests/ci/requirements.txt

        go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12'
    - name: Validate workflows and negative tests
      run: 'actionlint -shellcheck= -pyflakes=

        python3 -m unittest discover -s tests/ci -v
        make hooks
        bash scripts/verify/check-branch-policy.sh

        git ls-files -z ''*.sh'' | xargs -0 -n 1 bash -n'
  cpp:
    name: C++ 多平台编译与测试
    uses: ./.github/workflows/cmake-multi-platform.yml
    permissions:
      contents: read
    needs:
    - lint
    - security
  rust:
    name: Rust 构建、测试与跨语言契约
    uses: ./.github/workflows/rust.yml
    permissions:
      contents: read
    needs:
    - lint
    - security
  python:
    name: Python 锁定环境与隔离安装验收
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        version: 0.12.1
        enable-cache: true
        cache-dependency-glob: ml/training/uv.lock
    - name: 安装钉扎的 Python 并同步锁定环境
      run: 'uv python install "$(cat ml/training/.python-version)"

        uv sync --project ml/training --locked --group quality

        '
    - name: Ruff / Black / strict mypy 与反向注入
      run: bash scripts/verify/check-python-quality.sh
    - name: 离线验证锁文件、自证与仓库外安装包
      run: bash scripts/verify/check-training-project.sh
    needs:
    - lint
    - security
    timeout-minutes: 25
  go:
    name: Go / ${{ matrix.os }} / ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: ./.github/actions/toolchains
      with:
        go: ${{ matrix.go }}
    - name: Build and test modules
      run: "bash scripts/build/build-all.sh --go\nbash scripts/test/test-all.sh --go\nfor module in pkg routerd\
        \ policyd dnsd telemetryd; do\n  (cd \"services/${module}\" && GOWORK=off GOPROXY=off GOTOOLCHAIN=local\
        \ go vet ./... && GOWORK=off GOPROXY=off GOTOOLCHAIN=local go test -race -count=1 ./...)\ndone"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: matrix.os == 'ubuntu-24.04' && matrix.go == '1.27.3'
      with:
        name: control-plane-linux
        path: build/bin/
        if-no-files-found: error
        retention-days: 7
    needs:
    - lint
    - security
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04
          go: 1.22.x
        - os: ubuntu-24.04
          go: 1.27.3
        - os: macos-15
          go: 1.27.3
  e2e:
    name: Control-plane end-to-end
    needs:
    - go
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: ./.github/actions/toolchains
    - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        name: control-plane-linux
        path: build/bin/
    - name: Verify service behavior
      run: 'chmod +x build/bin/*

        bash scripts/ci/run-check.sh build/control-plane.log bash scripts/verify/e2e-control-plane.sh'
      env:
        WORK_DIR: ${{ runner.temp }}/control-plane
        KEEP_WORK: '1'
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: control-plane-evidence
        path: 'build/control-plane.log

          ${{ runner.temp }}/control-plane/'
        retention-days: 7
        if-no-files-found: error
  node:
    name: Pro console / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: ./.github/actions/toolchains
      with:
        node: ${{ matrix.node }}
    - name: Locked install and real Chromium tests
      run: 'cd web/console

        npm ci --no-audit --no-fund

        npx playwright install --with-deps chromium

        npm run typecheck:all

        npm test

        npm run build'
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: web-console-node-${{ matrix.node }}
        path: web/console/dist/
        retention-days: 7
        if-no-files-found: error
    needs:
    - lint
    - security
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node:
        - '22'
        - '24'
  lint:
    needs:
    - workflow-tests
    uses: ./.github/workflows/lint.yml
  security:
    needs:
    - workflow-tests
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      pull-requests: read
  clickhouse:
    name: ClickHouse native, durability and source resume
    needs:
    - cpp
    - rust
    - go
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLICKHOUSE_VERSION: 26.10.2.103
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: ./.github/actions/toolchains
      with:
        rust: 'true'
        go: 1.27.3
    - name: Compose storage and failure acceptance
      run: 'python3 scripts/verify/check-clickhouse-compose.py

        python3 scripts/verify/check-clickhouse-writer.py

        python3 scripts/verify/check-clickhouse-resume.py'
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: clickhouse-evidence
        path: build/storage-measurement/clickhouse-*.json
        retention-days: 7
        if-no-files-found: error
    - name: Cleanup isolated runner project
      run: docker compose -f deploy/docker/compose.storage-test.yml down --volumes
      if: always()
  linux-live:
    name: Linux isolated live capture
    needs:
    - cpp
    - rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: ./.github/actions/toolchains
      with:
        rust: 'true'
    - name: Install capture tools
      run: 'sudo apt-get update

        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark iproute2 iputils-ping'
    - name: Build and verify capture
      run: 'bash scripts/test/test-all.sh --cpp

        bash scripts/build/build-all.sh --rust

        bash scripts/ci/run-check.sh build/capture-modes.log sudo build/dataplane/packet-engine/test_capture_modes

        bash scripts/ci/run-check.sh build/live-capture.log bash scripts/ci/linux-live.sh'
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: linux-live-evidence
        path: 'build/capture-modes.log

          build/live-capture.log

          build/e2e-live/'
        retention-days: 7
        if-no-files-found: error
  package:
    name: Package tested Linux distribution
    needs:
    - workflow-tests
    - cpp
    - rust
    - python
    - go
    - e2e
    - node
    - lint
    - security
    - clickhouse
    - linux-live
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: ./.github/actions/toolchains
      with:
        rust: 'true'
        go: 1.27.3
    - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        name: control-plane-linux
        path: build/bin/
    - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        name: web-console-node-24
        path: build/release/web
    - name: Build exact-revision package and checksums
      run: bash scripts/release/package.sh
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: cythsec-linux-amd64
        path: 'build/release/*.tar.gz

          build/release/SHA256SUMS

          build/release/manifest.json'
        if-no-files-found: error
        retention-days: 14
  ci-required:
    name: CI required
    if: ${{ always() }}
    needs:
    - workflow-tests
    - cpp
    - rust
    - python
    - go
    - e2e
    - node
    - lint
    - security
    - clickhouse
    - linux-live
    - package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - name: Require success from every declared job
      run: python3 scripts/ci/check-results.py
      env:
        CI_NEEDS_JSON: ${{ toJSON(needs) }}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
