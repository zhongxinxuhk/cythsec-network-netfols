name: C++ package provenance
run-name: C++ provenance · ${{ github.event_name }} · ${{ github.ref_name }}
'on':
  workflow_dispatch: null
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  build:
    name: 构建、测试并计算真实 C++ 包摘要
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      digests: ${{ steps.hash.outputs.digests }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
    - name: 构建与测试
      run: 'bash scripts/test/prepare-rust-fixtures.sh

        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

        cmake --build build --parallel 2

        ctest --test-dir build --output-on-failure

        '
    - name: 打包真实产物
      run: "mkdir -p dist/cythsec-cpp\ncp VERSION dist/cythsec-cpp/\nfor bin in cythsec-capture cythsec-parse cythsec-dump-abi\
        \ cythsec-ring-feed; do\n  cp \"build/dataplane/packet-engine/$bin\" dist/cythsec-cpp/\ndone\ntar -czf dist/cythsec-cpp-linux-amd64.tar.gz\
        \ -C dist/cythsec-cpp .\n"
    - name: 生成与构建包逐字节对应的 subjects
      id: hash
      working-directory: dist
      run: 'sha256sum cythsec-cpp-linux-amd64.tar.gz > SHA256SUMS

        echo "digests=$(base64 -w0 SHA256SUMS)" >> "$GITHUB_OUTPUT"

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: cythsec-cpp-linux-amd64
        path: 'dist/cythsec-cpp-linux-amd64.tar.gz

          dist/SHA256SUMS

          '
        if-no-files-found: error
        retention-days: 14
    - name: 私有仓库的来源证明边界
      if: github.event.repository.private
      run: echo '本次仅保存已测试构建包与摘要；未启用向公共 Rekor 日志披露私有仓库名称的签名。' >> "$GITHUB_STEP_SUMMARY"
  provenance:
    if: ${{ !github.event.repository.private }}
    needs: build
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.digests }}
      upload-assets: ${{ github.event_name == 'release' }}
