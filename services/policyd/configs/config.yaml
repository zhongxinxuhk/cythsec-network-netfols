# policyd 运行时配置
#
# 优先级：命令行 flag > 环境变量（POLICYD_*）> 本文件 > 内置默认值。
# 注释行以 # 开头；本解析器仅支持顶层 key: value，不支持嵌套结构与行内注释。

# HTTP 监听地址
listen_addr: ":8081"

# 优雅关闭超时（Go duration 语法，如 10s / 5s）
shutdown_timeout: "10s"

# 日志级别：debug / info / warn / error
log_level: "info"

# 日志格式：json（生产，可被 jq 解析）/ text（开发，更易读）
log_format: "json"

# 是否暴露 GET /metrics
metrics_enabled: true

# JSON 策略文件路径；留空表示不载入，以空策略启动
policy_file: ""

# 允许载入的最大规则数；0 表示不限制
max_rules: 0

# 规则表文件路径（ruleir JSON 格式，含 tables[]）；留空表示不装载规则表
rule_tables_file: ""

# 允许载入的最大规则表数；0 表示不限制
max_rule_tables: 0

# 部署模式：bypass / on_path_inline / on_path_transparent / pcap
#
# 默认 bypass 是刻意的：旁路（端口镜像/SPAN）不在报文路径上，无法丢包与限速。
# 若默认成在线模式，实际旁路部署时会出现「规则命中但流量照走」的静默失效。
deploy_mode: "bypass"
