# dnsd 运行时配置
#
# 优先级：命令行 flag > 环境变量（DNSD_*）> 本文件 > 内置默认值。
# 注释行以 # 开头；本解析器仅支持顶层 key: value，不支持嵌套结构与行内注释。

# HTTP 监听地址
listen_addr: ":8082"

# 优雅关闭超时（Go duration 语法，如 10s / 5s）
shutdown_timeout: "10s"

# 日志级别：debug / info / warn / error
log_level: "info"

# 日志格式：json（生产，可被 jq 解析）/ text（开发，更易读）
log_format: "json"

# 是否暴露 GET /metrics
metrics_enabled: true

# JSON 区域文件路径；留空表示不载入，以空区域启动
zone_file: ""

# 允许载入的最大区域数；0 表示不限制
max_zones: 0
